# Render Blueprint: the API, the web app and a Key Value (Redis) instance, all on
# Render's free plan. Postgres (Neon) and object storage (Backblaze B2) live outside
# Render. Step-by-step guide, values for every variable, and the free-tier limits:
# docs/deployment.md.
#
# Variables marked `sync: false` are asked for when you create the Blueprint and are
# never stored in this file. Never put secrets here.

services:
  # ── API (NestJS) ────────────────────────────────────────────────────────────
  - type: web
    name: taxcy-api
    runtime: node
    plan: free
    region: singapore
    # Bun is preinstalled on Render's native runtimes (BUN_VERSION picks the version);
    # the API itself runs on Node.
    buildCommand: bun install --frozen-lockfile && bunx nx run @taxcy/api:build
    # Free web services have no pre-deploy command, so this script creates the app
    # role, applies migrations (and optionally seeds) before starting the API.
    startCommand: ./infra/render/start-api.sh
    healthCheckPath: /v1/health/live
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - apps/driver-app/**
        - docs/**
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: BUN_VERSION
        value: 1.4.2
      - key: NX_DAEMON
        value: 'false'
      - key: NX_NO_CLOUD
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # No free background workers on Render: the API runs the outbox relay, queue
      # workers and schedules itself. Keep the service at one instance.
      - key: JOBS_MODE
        value: in-process
      # No SMS provider yet: password-reset codes are written to the API log (Logs tab), and
      # production refuses that unless DEMO_MODE is on. Demo deployments only.
      - key: SMS_PROVIDER
        value: console
      - key: DEMO_MODE
        value: 'true'
      # Testing only: signs in as any user and resets any password (16+ characters).
      # Leave empty to switch it off.
      - key: MASTER_PASSWORD
        sync: false
      - key: OCR_PROVIDER
        value: stub
      # Load the demo fleet on start (skips once it exists). Set to true for a demo.
      - key: SEED_DEMO_DATA
        value: 'false'
      # Every client reaches the API through Render's proxy, so per-IP limits are
      # shared by everyone; per-phone limits still apply.
      - key: OTP_IP_LIMIT_PER_HOUR
        value: '120'
      - key: SIGNUP_IP_LIMIT_PER_HOUR
        value: '100'

      # Neon (or another Postgres with PostGIS). Owner URL for roles + migrations,
      # app-role URL (user taxcy_api, a password you choose) for the API.
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taxcy-redis
          property: connectionString

      # Backblaze B2 (S3 API). Endpoint e.g. https://s3.eu-central-003.backblazeb2.com;
      # region is its middle part (eu-central-003) and must match it.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: taxcy-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      # The web app's URL, e.g. https://taxcy-web.onrender.com (comma-separated).
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Web app (Flutter) ───────────────────────────────────────────────────────
  # The same app as the APK, built for the browser: owner mode (dashboard,
  # vehicles, drivers, money) and driver mode, chosen per fleet after sign-in.
  - type: web
    name: taxcy-web
    runtime: static
    # Fetches the pinned Flutter SDK (not in Render's image), then builds.
    buildCommand: ./infra/render/build-web.sh
    staticPublishPath: apps/driver-app/build/web
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/driver-app/**
        - infra/render/build-web.sh
    routes:
      # Client-side routing: every path serves the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Flutter's file names aren't content-hashed (main.dart.js), so browsers
      # must revalidate to pick up a new deploy.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: FLUTTER_VERSION
        value: 3.38.5
      # The API's public URL, e.g. https://taxcy-api.onrender.com, no /v1 (compiled
      # in at build time: redeploy the site after changing it).
      - key: API_URL
        sync: false

  # ── Redis for reset codes, rate limits and BullMQ ──────────────────────────────────
  - type: keyvalue
    name: taxcy-redis
    plan: free
    region: singapore
    # BullMQ needs noeviction: evicted keys would silently lose jobs.
    maxmemoryPolicy: noeviction
    # Internal connections only (the API, same region). No public access.
    ipAllowList: []
