<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet Sarthi</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 3rem">
    <p>Number verified. You can close this window.</p>
    <script>
      // redirect_url for phone.email's website sign-in. The app opens it in
      // "web plugin" mode, which messages the app window instead of coming
      // here; this page is the fallback if phone.email does return here with
      // ?access_token=…: hand the token to the opener (same origin only) and
      // close. The API checks the token with phone.email; it's single-use.
      (function () {
        var token = new URLSearchParams(location.search).get('access_token');
        var result = { type: 'phone-otp', accessToken: token };
        try {
          localStorage.setItem('phone-otp-result', JSON.stringify(result));
        } catch (e) {}
        history.replaceState(null, '', location.pathname);
        if (window.opener) {
          window.opener.postMessage(result, location.origin);
          window.close();
        } else {
          // Not a popup (phone.email navigated the app window here): go back
          // to the app rather than leave the user on this page.
          location.replace('/');
        }
      })();
    </script>
  </body>
</html>
