name: taxcy_driver
description: "Fleet Sarthi app: offline-first driver screens and online owner/manager mode"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  camera: ^0.12.0+2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  drift: ^2.28.0
  drift_flutter: any
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # Localizations are generated from lib/l10n/*.arb (see l10n.yaml) on pub get.
  generate: true
  fonts:
    # Inter is the typeface for headings and body text; Caveat is the handwritten
    # accent for key words (see accentStyle in lib/app/theme.dart). Both are
    # bundled, since the app works offline. OFL licences are beside the files.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    # Bundled so Hindi and Marathi (Devanagari) and Kannada render in the web build
    # without fetching fonts at runtime (phones have these scripts already). OFL
    # licences in assets/fonts/OFL.txt and OFL-NotoSansKannada.txt.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada.ttf
